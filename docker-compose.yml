
services:
  redis-voapi:
    image: redis:latest
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db-voapi:
    image: mysql:8.0.43
    restart: always
    volumes:
      - voapi-mysql-data:/var/lib/mysql
    configs:
      - source: db-init
        target: /docker-entrypoint-initdb.d/init-db.sql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: voapi
      MYSQL_PASSWORD: ${VOAPI_DB_PASSWORD}
      MYSQL_DATABASE: voapi
    command: --max_connections=5000 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  voapi-app:
    image: voapi/voapi:latest
    restart: always
    depends_on:
      db-voapi:
        condition: service_healthy
      redis-voapi:
        condition: service_healthy
    configs:
      - source: voapi-config
        target: /config.yml
    volumes:
      - voapi-files:/file
      - voapi-public:/public
    ports:
      - "6800:6800"

volumes:
  voapi-mysql-data:
  voapi-files:
  voapi-public:

configs:
  db-init:
    content: |
      CREATE DATABASE IF NOT EXISTS `voapi-log`
        CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS `voapi-body-log`
        CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      GRANT ALL PRIVILEGES ON `voapi-log`.* TO 'voapi'@'%';
      GRANT ALL PRIVILEGES ON `voapi-body-log`.* TO 'voapi'@'%';

  voapi-config:
    content: |
      app:
        port: 6800
      mysql:
        dsn: voapi:${VOAPI_DB_PASSWORD}@tcp(db-voapi:3306)/voapi
        log-dsn: voapi:${VOAPI_DB_PASSWORD}@tcp(db-voapi:3306)/voapi-log
        log-body-dsn: voapi:${VOAPI_DB_PASSWORD}@tcp(db-voapi:3306)/voapi-body-log
        log-sharding:
          enable: false
          mode: y
      redis:
        dsn: redis://redis-voapi:6379/0
        pool-size: 0
