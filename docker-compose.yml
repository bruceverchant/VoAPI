
services:
  mysql:
    image: mysql:8.0.43
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: voapi
      MYSQL_USER: voapi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - type: volume
        source: mysqldata
        target: /var/lib/mysql
    configs:
      - source: initsql
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  voapi:
    image: voapi/voapi:latest
    restart: unless-stopped
    ports:
      - "6800:6800"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    configs:
      - source: appconfig
        target: /config.yml

volumes:
  mysqldata:
    driver: local

configs:
  initsql:
    content: |
      CREATE DATABASE IF NOT EXISTS `voapi-log`;
      CREATE DATABASE IF NOT EXISTS `voapi-body-log`;
      GRANT ALL PRIVILEGES ON `voapi-log`.* TO 'voapi'@'%';
      GRANT ALL PRIVILEGES ON `voapi-body-log`.* TO 'voapi'@'%';

  appconfig:
    content: |
      app:
        port: 6800
      mysql:
        dsn: voapi:${MYSQL_PASSWORD}@tcp(mysql:3306)/voapi
        log-dsn: voapi:${MYSQL_PASSWORD}@tcp(mysql:3306)/voapi-log
        log-body-dsn: voapi:${MYSQL_PASSWORD}@tcp(mysql:3306)/voapi-body-log
        log-sharding:
          enable: false
          mode: y
      redis:
        dsn: redis://redis:6379/0
        pool-size: 0
